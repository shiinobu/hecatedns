#!/usr/sbin/nft -f
# UNVERIFIED: written on Windows without a Linux machine, and a wrong firewall can lock you out of SSH.
# Before loading it: keep a second SSH session open, run "nft -c -f nftables.conf" to check the syntax, and arm a
# safety net with "systemd-run --on-active=5m nft flush ruleset" that you cancel only after you tested a new login.
# What it does: the default is drop; only SSH (22) and DoT (853) are open; port 53 is closed to the world.
# Per source (IPv4 address or IPv6 /64): at most 6 new SSH connections a minute, at most 60 new DoT connections a
# minute and at most 16 open DoT connections. A phone never gets near these numbers. This is the second layer behind
# the rate limit and the connection caps of the server itself.
flush ruleset

table inet hecate {
	set ssh_rate4 { type ipv4_addr; flags dynamic, timeout; timeout 1m; size 8192; }
	set ssh_rate6 { type ipv6_addr; flags dynamic, timeout; timeout 1m; size 8192; }
	set dot_rate4 { type ipv4_addr; flags dynamic, timeout; timeout 1m; size 8192; }
	set dot_rate6 { type ipv6_addr; flags dynamic, timeout; timeout 1m; size 8192; }
	set dot_conn4 { type ipv4_addr; flags dynamic; size 8192; }
	set dot_conn6 { type ipv6_addr; flags dynamic; size 8192; }

	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept
		iifname "lo" accept

		meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
		meta l4proto ipv6-icmp icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } limit rate 20/second accept

		tcp dport 22 ct state new add @ssh_rate4 { ip saddr limit rate over 6/minute burst 6 packets } counter drop
		tcp dport 22 ct state new add @ssh_rate6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 6/minute burst 6 packets } counter drop
		tcp dport 22 accept

		tcp dport 853 ct state new add @dot_rate4 { ip saddr limit rate over 60/minute burst 30 packets } counter drop
		tcp dport 853 ct state new add @dot_rate6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 60/minute burst 30 packets } counter drop
		tcp dport 853 ct state new add @dot_conn4 { ip saddr ct count over 16 } counter drop
		tcp dport 853 ct state new add @dot_conn6 { ip6 saddr & ffff:ffff:ffff:ffff:: ct count over 16 } counter drop
		tcp dport 853 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
