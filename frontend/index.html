<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content='width=device-width, initial-scale=1, viewport-fit=cover'>
  <meta name="color-scheme" content='dark'>
  <meta name="theme-color" content='#0A0618'>
  <title>HecateDNS</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="lists.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <defs>
      <linearGradient id="grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E0AAFF"/>
        <stop offset="55%" stop-color="#AA45E9"/>
        <stop offset="100%" stop-color="#7B2CBF"/>
      </linearGradient>
      <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#72EFDD"/>
        <stop offset="55%" stop-color="#2DD4E8"/>
        <stop offset="100%" stop-color="#0096C7"/>
      </linearGradient>
      <linearGradient id="grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#AA45E9"/>
        <stop offset="100%" stop-color="#2DD4E8"/>
      </linearGradient>
      <linearGradient id="grad-block-arc" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#AA45E9"/>
        <stop offset="100%" stop-color="#FF5C7A"/>
      </linearGradient>
    </defs>
    <symbol id="icon-hecate" viewBox="0 0 64 64">
      <path class="mark-shield" d="M32 5L54 13v18c0 15.5-9.2 26-22 30C19.2 57 10 46.5 10 31V13L32 5z"/>
      <path d="M25 18a13 13 0 000 26 16.5 16.5 0 010-26z" fill="url(#grad-violet)"/>
      <path d="M39 18a13 13 0 010 26 16.5 16.5 0 000-26z" fill="url(#grad-cyan)"/>
      <circle cx="32" cy="23" r="2.6" fill="#2DD4E8"/>
      <circle cx="27" cy="28" r="2.6" fill="#E0AAFF"/>
      <circle cx="37" cy="28" r="2.6" fill="#2DD4E8"/>
      <path class="mark-key" d="M32 25.5v21m-5-16l5 4.5 5-4.5m-5 10.5h4.5m-4.5 4h3.5"/>
    </symbol>
    <symbol id="icon-status" viewBox="0 0 24 24">
      <path d="M3 12h4l2.5-6 5 12 2.5-6H21"/>
    </symbol>
    <symbol id="icon-queries" viewBox="0 0 24 24">
      <path d="M4 6h16M4 12h16M4 18h10"/>
    </symbol>
    <symbol id="icon-rules" viewBox="0 0 24 24">
      <path d="M12 3l8 3.5v5.5c0 5-3.5 8.5-8 9.5-4.5-1-8-4.5-8-9.5V6.5L12 3z"/>
    </symbol>
    <symbol id="icon-conn" viewBox="0 0 24 24">
      <path d="M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>
    </symbol>
    <symbol id="icon-ok" viewBox="0 0 24 24">
      <path d="M20 6L9 17l-5-5"/>
    </symbol>
    <symbol id="icon-block" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M5.7 5.7l12.6 12.6"/>
    </symbol>
    <symbol id="icon-allow" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M8.5 12.5l2.5 2.5 4.5-5"/>
    </symbol>
    <symbol id="icon-warn" viewBox="0 0 24 24">
      <path d="M12 3L2 20h20L12 3zm0 6v5m0 3h.01"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="M20 20l-4.2-4.2"/>
    </symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24">
      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-eye-off" viewBox="0 0 24 24">
      <path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.6 6.7C3.9 8.5 2 12 2 12s3.6 7 10 7a9.7 9.7 0 004.4-1M9.9 9.9a3 3 0 004.2 4.2"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="11" height="11" rx="2"/>
      <path d="M5 15V6a2 2 0 012-2h9"/>
    </symbol>
    <symbol id="icon-chev-left" viewBox="0 0 24 24">
      <path d="M15 6l-6 6 6 6"/>
    </symbol>
    <symbol id="icon-chev-right" viewBox="0 0 24 24">
      <path d="M9 6l6 6-6 6"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14l5-5-5-5m5 5H9"/>
    </symbol>
  </svg>

  <div class="app-shell">
    <header id="shell-header" class="shell-header" hidden>
      <div class="brand">
        <svg class="brand-mark" aria-hidden="true"><use href="#icon-hecate"></use></svg>
        <h1 class="brand-wordmark">HecateDNS</h1>
      </div>
      <div class="header-tools">
        <button type="button" id="btn-refresh" class="btn btn-soft btn-icon" aria-label="Refresh">
          <svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
        </button>
        <button type="button" id="btn-logout" class="btn btn-soft btn-icon btn-quiet" aria-label="Sign out" hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-logout"></use></svg>
        </button>
      </div>
    </header>

    <main id="main-content" class="shell-main">
      <div id="screen-bar" class="screen-bar" hidden>
        <h2 id="screen-title" class="screen-title">Status</h2>
        <div class="screen-meta">
          <span id="stale-badge" class="meta-tag meta-warn" hidden>Old data</span>
          <span id="updated-text" class="meta-tag meta-muted">Updated --:--</span>
        </div>
      </div>

      <div id="banner-slot" class="banner-slot" aria-live="polite"></div>

      <section id="view-login" class="screen-view login-screen" aria-labelledby="login-heading" hidden>
        <div class="login-stage">
          <div class="login-hero">
            <svg class="login-mark" aria-hidden="true"><use href="#icon-hecate"></use></svg>
            <h2 id="login-heading" class="login-wordmark">HecateDNS</h2>
            <p class="login-tagline">Shielding your digital crossroads</p>
          </div>
          <div class="card login-card">
            <form id="login-form" class="form-stack" novalidate>
              <div class="field">
                <label class="field-label" for="login-key">Access key</label>
                <input class="field-input field-mono" type="password" id="login-key" name="key" autocomplete="off" required>
                <p id="login-error" class="field-error" role="alert" hidden></p>
              </div>
              <div class="card-actions">
                <button type="submit" id="login-submit" class="btn btn-primary btn-full">Sign in</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section id="view-status" class="screen-view" aria-label="Status" hidden>
        <div id="status-content" class="card-stack"></div>
      </section>

      <section id="view-queries" class="screen-view" aria-label="Queries" hidden>
        <div class="card-stack">
          <div class="card panel-glass">
            <div class="field">
              <label class="sr-only" for="queries-search">Search domain</label>
              <div class="field-control search-control">
                <svg class="icon field-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
                <input class="field-input field-input-icon field-mono well-input search-input" type="search" id="queries-search" maxlength="100" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search domain">
                <button type="button" id="queries-clear" class="search-clear" aria-label="Clear search">
                  <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
                </button>
              </div>
              <p id="queries-error" class="field-error" role="alert" hidden></p>
            </div>
            <div class="seg-toolbar">
              <div class="seg-group" data-count="4" data-active="0" role="group" aria-label="Time window">
                <button type="button" class="seg-btn" data-window="15m" aria-pressed="true">15m</button>
                <button type="button" class="seg-btn" data-window="1h" aria-pressed="false">1h</button>
                <button type="button" class="seg-btn" data-window="6h" aria-pressed="false">6h</button>
                <button type="button" class="seg-btn" data-window="24h" aria-pressed="false">24h</button>
              </div>
              <div class="seg-group seg-decision" data-count="3" data-active="0" role="group" aria-label="Decision filter">
                <button type="button" class="seg-btn" data-decision="all" aria-pressed="true">All</button>
                <button type="button" class="seg-btn" data-decision="block" aria-pressed="false">Block</button>
                <button type="button" class="seg-btn" data-decision="pass" aria-pressed="false">Pass</button>
              </div>
            </div>
          </div>
          <div id="queries-partial" class="banner banner-warn" hidden>
            <div class="banner-body">
              <svg class="icon" aria-hidden="true"><use href="#icon-warn"></use></svg>
              <span>Partial count</span>
            </div>
          </div>
          <div id="queries-list" class="card-stack queries-scroll"></div>
          <div class="pager">
            <div class="seg-group" data-count="3" data-active="0" role="group" aria-label="Rows per page">
              <button type="button" class="seg-btn" data-size="25" aria-pressed="true">25</button>
              <button type="button" class="seg-btn" data-size="50" aria-pressed="false">50</button>
              <button type="button" class="seg-btn" data-size="100" aria-pressed="false">100</button>
            </div>
            <div class="pager-nav">
              <button type="button" id="queries-prev" class="btn btn-soft btn-icon" aria-label="Previous page">
                <svg class="icon" aria-hidden="true"><use href="#icon-chev-left"></use></svg>
              </button>
              <p class="pager-text" aria-live="polite"><span id="queries-page">Page 1 of 1</span><small id="queries-total">0 results</small></p>
              <button type="button" id="queries-next" class="btn btn-soft btn-icon" aria-label="Next page">
                <svg class="icon" aria-hidden="true"><use href="#icon-chev-right"></use></svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-rules" class="screen-view" aria-label="Rules" hidden>
        <div class="card-stack">
          <label class="section-label" for="rules-domain">Domain</label>
          <div class="card panel-glass">
            <form id="rules-form" class="form-stack" novalidate>
              <div class="field">
                <input class="field-input field-mono well-input" type="text" id="rules-domain" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="example.com">
                <p id="rules-error" class="field-error" role="alert" hidden></p>
              </div>
              <div class="card-actions">
                <button type="button" id="btn-rule-block" class="btn btn-block btn-soft">
                  <svg class="icon" aria-hidden="true"><use href="#icon-block"></use></svg>
                  <span>Block</span>
                </button>
                <button type="button" id="btn-rule-allow" class="btn btn-allow btn-soft">
                  <svg class="icon" aria-hidden="true"><use href="#icon-allow"></use></svg>
                  <span>Allow</span>
                </button>
              </div>
            </form>
          </div>
          <div class="card card-flush">
            <div id="rules-list" class="row-list"></div>
            <p id="rules-summary" class="card-footer-meta"></p>
          </div>
        </div>
      </section>

      <section id="view-connection" class="screen-view" aria-label="Connection" hidden>
        <div id="connection-content" class="card-stack"></div>
      </section>
    </main>

    <div id="toast-slot" class="toast-slot" aria-live="polite"></div>

    <nav id="tab-bar" class="tab-bar" data-active-index="0" aria-label="Main navigation" hidden>
      <span class="tab-indicator" aria-hidden="true"></span>
      <a href="#/status" class="tab-item" data-route="status" aria-current="page">
        <svg class="icon" aria-hidden="true"><use href="#icon-status"></use></svg>
        <span>Status</span>
      </a>
      <a href="#/queries" class="tab-item" data-route="queries">
        <svg class="icon" aria-hidden="true"><use href="#icon-queries"></use></svg>
        <span>Queries</span>
      </a>
      <a href="#/rules" class="tab-item" data-route="rules">
        <svg class="icon" aria-hidden="true"><use href="#icon-rules"></use></svg>
        <span>Rules</span>
      </a>
      <a href="#/connection" class="tab-item" data-route="connection">
        <svg class="icon" aria-hidden="true"><use href="#icon-conn"></use></svg>
        <span>Connection</span>
      </a>
    </nav>
  </div>
</body>
</html>
